version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    # One PR per ecosystem group rather than one per package: a dozen separate
    # patch bumps a week is how dependency PRs start getting rubber-stamped.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies', 'ci']

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    labels: ['dependencies', 'docker']
